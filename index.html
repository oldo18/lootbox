/* ============================================================
   CELKOVÝ PROGRESS (footer dole na obrazovke) — počíta sa cez
   celý dotazník, 'trial' (DDT úloha) sa počíta ako 6 samostatných
   krokov podľa state.trial. Obrazovky mimo tohto zoznamu (intro,
   instructions, ineligible_*, thanks) progress nezobrazujú.
   'country_other' sa počíta ako alias 'country'.
   ============================================================ */
const PROGRESS_FLOW = [
  'age', 'played30', 'hours7d', 'game_played', 'lootbox12mo', 'trial',
  'rlbi', 'aeq1', 'aeq2', 'lbspend', 'income',
  'gender', 'education', 'employment', 'country', 'platform',
];
const PROGRESS_TRIAL_STEPS = 6;

function getProgress() {
  const screen = state.screen === 'country_other' ? 'country' : state.screen;
  const idx = PROGRESS_FLOW.indexOf(screen);
  if (idx === -1) return null;
  const trialIdx = PROGRESS_FLOW.indexOf('trial');
  const total = PROGRESS_FLOW.length - 1 + PROGRESS_TRIAL_STEPS;
  let done;
  if (idx < trialIdx) {
    done = idx;
  } else if (idx === trialIdx) {
    done = trialIdx + (state.trial - 1);
  } else {
    done = trialIdx + PROGRESS_TRIAL_STEPS + (idx - trialIdx - 1);
  }
  return { step: done + 1, total, percent: Math.round(((done + 1) / total) * 100) };
}

function renderProgressFooter() {
  const p = getProgress();
  if (!p) return '';
  return '<div class="progress-footer">' +
    '<div class="progress-bar"><div class="progress-bar-fill" style="width:' + p.percent + '%"></div></div>' +
    '<div class="progress-footer-label">' + p.step + ' / ' + p.total + ' (' + p.percent + ' %)</div>' +
  '</div>';
}

function renderNumericScreen(app, opts) {
  app.innerHTML =
    '<h1>' + opts.title + '</h1>' +
    (opts.note ? '<p class="muted">' + opts.note + '</p>' : '') +
    '<div class="numeric-row">' +
      '<input type="number" id="numInput" inputmode="decimal" placeholder="0">' +
      (opts.suffix ? '<span class="numeric-suffix">' + opts.suffix + '</span>' : '') +
    '</div>' +
    '<button class="btn-primary" id="numContinue">' + T.continueBtn + '</button>' +
    renderProgressFooter();
  const input = document.getElementById('numInput');
  const btn = document.getElementById('numContinue');
  const submit = () => {
    const val = parseFloat((input.value || '').replace(',', '.'));
    const min = opts.min != null ? opts.min : -Infinity;
    const max = opts.max != null ? opts.max : Infinity;
    if (input.value === '' || isNaN(val) || val < min || val > max) {
      input.classList.add('input-error');
      return;
    }
    input.classList.remove('input-error');
    opts.onSubmit(val);
  };
  btn.addEventListener('click', submit);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
}

function renderLikertScreen(app, opts) {
  state.pageStartTs[opts.pageKey] = performance.now();
  const leftLabel = opts.scale[0].label;
  const rightLabel = opts.scale[opts.scale.length - 1].label;
  const rows = opts.items.map((item, i) =>
    '<div class="likert-row" data-row-key="' + item.key + '">' +
      '<div class="likert-text">' + (i + 1) + '. ' + item.text + '</div>' +
      '<div class="likert-scale-row">' +
        '<span class="likert-endpoint left">' + leftLabel + '</span>' +
        '<div class="likert-dots">' +
          opts.scale.map(s => '<button class="likert-dot" data-key="' + item.key + '" data-v="' + s.v + '" ' +
            'aria-label="' + s.label + '"></button>').join('') +
        '</div>' +
        '<span class="likert-endpoint right">' + rightLabel + '</span>' +
      '</div>' +
    '</div>'
  ).join('');
  app.innerHTML =
    '<h1>' + opts.title + '</h1>' +
    (opts.note ? '<p class="muted">' + opts.note + '</p>' : '') +
    rows +
    '<button class="btn-primary" id="likertContinue">' + T.continueBtn + '</button>' +
    '<div class="likert-progress" id="likertProgress"></div>' +
    renderProgressFooter();

  const answers = {};
  const btn = document.getElementById('likertContinue');
  const progressEl = document.getElementById('likertProgress');
  const updateProgress = () => {
    progressEl.textContent = 'Zodpovězeno: ' + Object.keys(answers).length + ' / ' + opts.items.length;
  };
  updateProgress();

  app.querySelectorAll('.likert-dot').forEach(b => {
    b.addEventListener('click', () => {
      const key = b.dataset.key, v = parseInt(b.dataset.v, 10);
      answers[key] = v;
      app.querySelectorAll('.likert-dot[data-key="' + key + '"]').forEach(x => x.classList.remove('selected'));
      b.classList.add('selected');
      const row = app.querySelector('.likert-row[data-row-key="' + key + '"]');
      if (row) row.classList.remove('missing');
      updateProgress();
    });
  });

  btn.addEventListener('click', () => {
    const missingItem = opts.items.find(item => answers[item.key] === undefined);
    if (missingItem) {
      app.querySelectorAll('.likert-row').forEach(r => r.classList.remove('missing'));
      const row = app.querySelector('.likert-row[data-row-key="' + missingItem.key + '"]');
      if (row) {
        row.classList.add('missing');
        if (typeof row.scrollIntoView === 'function') {
          row.scrollIntoView({ block: 'center', behavior: 'smooth' });
        }
      }
      return;
    }
    const durationMs = Math.round(performance.now() - state.pageStartTs[opts.pageKey]);
    opts.onSubmit(answers, durationMs);
  });
}

function beginTrialTimer() { state.trialStartTs = performance.now(); }

function currentTrialContent() {
  if (state.trial === 6 && state.attentionType === 'A') {
    return { kind:'attentionA', node:1,
      sooner:{amountEur:0,label:T.soonerSuffix,correct:false},
      later:{amountEur:CONFIG.AMOUNT_EUR,delayLabel:LABELS[1],correct:true} };
  }
  if (state.trial === 6 && state.attentionType === 'B') {
    return { kind:'attentionB', node:63,
      sooner:{amountEur:CONFIG.AMOUNT_EUR,label:T.soonerSuffix,correct:true},
      later:{amountEur:CONFIG.AMOUNT_EUR,delayLabel:LABELS[63],correct:false} };
  }
  return { kind:'normal', node: state.index,
    sooner:{amountEur:CONFIG.AMOUNT_EUR/2,label:T.soonerSuffix},
    later:{amountEur:CONFIG.AMOUNT_EUR,delayLabel:LABELS[state.index]} };
}

function renderTrial(app) {
  const content = currentTrialContent();
  const soonerText = formatAmount(content.sooner.amountEur) + ' ' + (content.sooner.label || T.soonerSuffix);
  const laterText = formatAmount(content.later.amountEur) + ' ' + T.laterPrefix + ' ' + (content.later.delayLabel || '');

  const soonerFirst = Math.random() < 0.5;
  const order = soonerFirst ? ['sooner', 'later'] : ['later', 'sooner'];
  const buttonHtml = order.map(kind => {
    const label = kind === 'sooner' ? soonerText : laterText;
    return '<button class="choice-btn" data-choice="' + kind + '">' + label + '</button>';
  }).join('');

  app.innerHTML =
    '<div class="progress-label">' + T.questionLabel(state.trial) + '</div>' +
    '<div class="progress-bar"><div class="progress-bar-fill" style="width:' + (state.trial / 6 * 100) + '%"></div></div>' +
    '<div class="choices">' + buttonHtml + '</div>' +
    renderProgressFooter();

  document.querySelectorAll('.choice-btn').forEach(b => {
    b.addEventListener('click', () => handleChoice(b.dataset.choice, content));
  });
  beginTrialTimer();
}

function handleChoice(pickedKind, content) {
  const rtMs = Math.round(performance.now() - state.trialStartTs);
  const flagTooFast = rtMs < CONFIG.MIN_PLAUSIBLE_RT_MS;

  if (content.kind === 'normal') {
    const choice = pickedKind === 'sooner' ? 'imm' : 'del';
    state.trialLog.push({ trial: state.trial, kind:'normal', node: content.node,
      delay_label: LABELS[content.node], choice, rt_ms: rtMs, flag_too_fast: flagTooFast });

    if (state.trial < 6) {
      state.choices.push(choice);
      state.index = choice === 'imm' ? state.index - state.step : state.index + state.step;
      state.step = state.step / 2;
      state.trial += 1;
      if (state.trial === 6) {
        const allImm = state.choices.every(c => c === 'imm');
        const allDel = state.choices.every(c => c === 'del');
        state.attentionType = allImm ? 'A' : (allDel ? 'B' : null);
      }
      render();
    } else {
      const k = choice === 'imm' ? ODD_K[content.node].imm : ODD_K[content.node].del;
      finishDiscountingTask({ attentionTriggered:false, attentionPassed:null, k });
    }
    return;
  }

  const chosenSide = pickedKind === 'sooner' ? content.sooner : content.later;
  const passed = !!chosenSide.correct;
  state.trialLog.push({ trial:6, kind:'attention_' + state.attentionType, node: content.node,
    delay_label: LABELS[content.node], choice: pickedKind, rt_ms: rtMs, flag_too_fast: flagTooFast, passed });

  let k = null;
  if (passed) k = state.attentionType === 'A' ? ODD_K[1].del : ODD_K[63].imm;
  finishDiscountingTask({ attentionTriggered:true, attentionPassed:passed, k });
}

function finishDiscountingTask({ attentionTriggered, attentionPassed, k }) {
  const rts = state.trialLog.map(x => x.rt_ms);
  state.answers.dd_k = k;
  state.answers.dd_ed50_days = k ? 1 / k : null;
  state.answers.dd_log10_k = k ? Math.log10(k) : null;
  state.answers.dd_attention_triggered = attentionTriggered;
  state.answers.dd_attention_type = state.attentionType || '';
  state.answers.dd_attention_passed = attentionPassed;
  state.answers.dd_min_rt_ms = Math.min.apply(null, rts);
  state.answers.dd_flag_too_fast = state.trialLog.some(x => x.flag_too_fast);
  state.trialLog.forEach((entry, i) => {
    const p = 'dd_t' + (i + 1) + '_';
    state.answers[p + 'kind'] = entry.kind;
    state.answers[p + 'delay_label'] = entry.delay_label || '';
    state.answers[p + 'choice'] = entry.choice;
    state.answers[p + 'rt_ms'] = entry.rt_ms;
  });

  state.screen = 'rlbi';
  render();
}

/* ============================================================
   ODOSIELANIE DÁT
   ============================================================ */
function finishSurvey() {
  const payload = Object.assign(
    { record_type:'survey', participant_id: state.participantId, study_id: CONFIG.STUDY_ID,
      currency: state.currency, amount_eur: CONFIG.AMOUNT_EUR,
      started_at: state.studyStartIso, finished_at: new Date().toISOString() },
    state.answers
  );
  state.lastPayload = payload;
  state.screen = 'thanks';
  render();
  submitData(payload);
}

function submitScreenedOut(reason, age) {
  postToScript({ record_type:'screened_out', study_id: CONFIG.STUDY_ID, reason,
    age: age != null ? age : null, timestamp: new Date().toISOString() });
}

async function postToScript(payload) {
  try {
    if (isSupabaseConfigured()) {
      if (payload.record_type === 'survey') {
        const row = {
          participant_id: payload.participant_id,
          study_id: payload.study_id,
          currency: payload.currency || null,
          amount_eur: payload.amount_eur || null,
          submitted_at: payload.finished_at || payload.submitted_at || new Date().toISOString(),
          payload: payload,
        };
        return await postToSupabase('survey_responses', row);
      }
      if (payload.record_type === 'screened_out') {
        return await postToSupabase('screened_out', {
          study_id: payload.study_id,
          reason: payload.reason,
          age: payload.age != null ? Number(payload.age) : null,
        });
      }
      if (payload.record_type === 'raffle') {
        return await postToSupabase('raffle_entries', {
          study_id: payload.study_id,
          email: payload.email,
        });
      }
    }

    if (!CONFIG.GOOGLE_SCRIPT_URL) return 'not_configured';
    await fetch(CONFIG.GOOGLE_SCRIPT_URL, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload),
    });
    return 'sent';
  } catch (err) {
    return 'error';
  }
}

async function submitData(payload) {
  const status = await postToScript(payload);
  state.sendStatus = status === 'not_configured' ? 'not_configured' : status;
  renderThanksStatus();
}

function isSupabaseConfigured() {
  return !!CONFIG.SUPABASE_URL && !!CONFIG.SUPABASE_ANON_KEY && CONFIG.USE_SUPABASE;
}

async function postToSupabase(tableName, row) {
  if (!isSupabaseConfigured()) return null;
  const baseUrl = CONFIG.SUPABASE_URL.replace(/\/$/, '');
  const response = await fetch(baseUrl + '/rest/v1/' + tableName, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      apikey: CONFIG.SUPABASE_ANON_KEY,
      Authorization: 'Bearer ' + CONFIG.SUPABASE_ANON_KEY,
      Prefer: 'return=minimal',
    },
    body: JSON.stringify(row),
  });
  if (!response.ok) {
    const text = await response.text();
    throw new Error(text || ('Supabase insert failed: ' + response.status));
  }
  return 'sent';
}

async function submitRaffleEmail(email) {
  // ZÁMERNE bez participant_id — e-mail sa neprepája s odpoveďami.
  const status = await postToScript({ record_type:'raffle', study_id: CONFIG.STUDY_ID, email,
    timestamp: new Date().toISOString() });
  if (status === 'sent') {
    const box = document.querySelector('.raffle-box');
    if (box) {
      box.innerHTML = '<h2>' + T.raffleThanksTitle + '</h2><p class="muted">' + T.raffleThanksBody + '</p>';
    }
    return;
  }
  const noteEl = document.getElementById('raffleStatus');
  if (noteEl) noteEl.textContent = status === 'not_configured' ? T.raffleNotConfiguredMsg : T.raffleErrorMsg;
}

function renderThanksStatus() {
  const el = document.getElementById('statusNote');
  if (!el) return;
  if (state.sendStatus === 'sent') {
    el.className = 'status-note ok'; el.textContent = T.sentOk;
  } else if (state.sendStatus === 'error') {
    el.className = 'status-note warn'; el.textContent = T.sentError;
    document.getElementById('backupBtn').style.display = 'block';
  } else if (state.sendStatus === 'not_configured') {
    el.className = 'status-note warn'; el.textContent = T.notConfigured;
    document.getElementById('backupBtn').style.display = 'block';
  }
}

function renderThanks(app) {
  app.innerHTML =
    '<h1>' + T.thanksTitle + '</h1>' +
    '<p>' + T.thanksBody + '</p>' +
    '<div class="pid-box"><span id="pidText">' + state.participantId + '</span>' +
    '<button id="copyPid">' + T.copyBtn + '</button></div>' +
    '<div id="statusNote" class="status-note ok">…</div>' +
    '<button class="btn-secondary" id="backupBtn" style="display:none">' + T.backupBtn + '</button>' +
    '<div class="raffle-box">' +
      '<h2>' + T.raffleTitle + '</h2>' +
      '<p class="muted">' + T.raffleBody + '</p>' +
      '<input type="email" class="text-input" id="raffleEmail" placeholder="' + T.raffleEmailPlaceholder + '">' +
      '<div class="consent-row">' +
        '<input type="checkbox" id="raffleConsentBox">' +
        '<label for="raffleConsentBox">' + T.raffleConsentLabel + '</label>' +
      '</div>' +
      '<button class="btn-primary" id="raffleSend" disabled>' + T.raffleSendBtn + '</button>' +
      '<p class="muted" id="raffleStatus"></p>' +
    '</div>';

  const raffleEmail = document.getElementById('raffleEmail');
  const raffleConsentBox = document.getElementById('raffleConsentBox');
  const raffleSendBtn = document.getElementById('raffleSend');
  const updateRaffleButtonState = () => {
    const emailOk = raffleEmail.value.trim() && raffleEmail.value.indexOf('@') !== -1;
    raffleSendBtn.disabled = !(emailOk && raffleConsentBox.checked);
  };

  raffleEmail.addEventListener('input', updateRaffleButtonState);
  raffleConsentBox.addEventListener('change', updateRaffleButtonState);

  document.getElementById('copyPid').addEventListener('click', () => {
    navigator.clipboard.writeText(state.participantId).then(() => {
      document.getElementById('copyPid').textContent = T.copiedBtn;
    });
  });
  document.getElementById('backupBtn').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(state.lastPayload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = state.participantId + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });
  raffleSendBtn.addEventListener('click', () => {
    const email = raffleEmail.value.trim();
    if (!email || email.indexOf('@') === -1) return;
    if (!raffleConsentBox.checked) return;
    submitRaffleEmail(email);
  });
  renderThanksStatus();
}

render();
